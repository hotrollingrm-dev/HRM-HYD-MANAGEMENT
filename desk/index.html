*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;background:
  radial-gradient(38% 42% at 12% 8%,var(--amb1),transparent 70%),
  radial-gradient(30% 36% at 88% 14%,var(--amb2),transparent 70%),
  radial-gradient(36% 40% at 74% 96%,var(--amb3),transparent 70%),
  radial-gradient(28% 34% at 30% 88%,var(--amb4),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:progress}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.bi{display:inline-flex;flex-direction:column;line-height:1.25;min-width:0}
.bi .en{font-size:max(14px,.78em);color:var(--fg-2);font-weight:400;letter-spacing:.01em}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.muted{color:var(--fg-2)}
.hint{font-size:15px;color:var(--fg-2)}

/* ---------- Liquid glass ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-edge),var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 72%,rgba(255,255,255,.1));mix-blend-mode:soft-light}
.card{position:relative;background:var(--card);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--glass-border);border-radius:var(--r-xl);padding:24px;box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow);min-width:0;min-height:0}

/* ---------- Shell ---------- */
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--gap);padding:var(--gap)}
.sidebar{width:284px;height:100%;border-radius:30px;padding:18px 12px;display:flex;flex-direction:column;gap:6px;transition:width .34s var(--ease);z-index:20;overflow:hidden}
.app[data-sb="collapsed"] .sidebar{width:92px}
.brand{display:flex;align-items:center;gap:14px;height:72px;padding:0 11px;margin-bottom:14px;flex:none}
.brand svg{flex:none}
.brand .name{font-size:19px;font-weight:700;letter-spacing:.06em;line-height:1.2}
.brand .tag{font-size:14px;color:var(--fg-2)}
.lbl{white-space:nowrap;overflow:hidden;transition:opacity .2s ease,transform .26s var(--ease)}
.app[data-sb="collapsed"] .sidebar .lbl{opacity:0;transform:translateX(-8px);pointer-events:none}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{position:relative;display:flex;align-items:center;gap:18px;min-height:66px;padding:0 21px;border-radius:22px;border:0;background:transparent;text-align:left;width:100%;color:var(--fg-2);overflow:hidden;flex:none;transition:background .2s,color .2s}
.nav-item>svg{flex:none;width:26px;height:26px}
.nav-item .lbl .th{font-size:18px;color:var(--fg);font-weight:500}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--glass-strong);color:var(--primary);box-shadow:inset 0 1px 0 var(--glass-hi),0 4px 14px rgba(20,40,90,.08)}
.nav-item.on .lbl .th{color:var(--primary);font-weight:700}
.nav-item.on::after{content:"";position:absolute;left:6px;top:22px;bottom:22px;width:4px;border-radius:2px;background:var(--primary)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.machine-card{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:22px;background:var(--surface-2);overflow:hidden}
.machine-card svg{flex:none}
.machine-card .lbl{white-space:normal}.machine-card .lbl .th{font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nav-item .chev{transition:transform .34s var(--ease)}
.app[data-sb="collapsed"] .nav-item .chev{transform:rotate(180deg)}
.tip{position:fixed;z-index:300;background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:16px;font-size:16px;line-height:1.3;pointer-events:none;opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .15s;box-shadow:var(--shadow-up);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tip .en{display:block;font-size:14px;color:var(--toast-en)}
.tip.show{opacity:1;transform:none}

.main{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--gap);min-width:0;min-height:0}
.header{border-radius:26px;min-height:84px;padding:12px 14px 12px 28px;display:flex;align-items:center;gap:18px;min-width:0}
.header .ttl{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.header .ttl .th{font-size:28px;font-weight:700;line-height:1.2}
.header .ttl .en{font-size:15px}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;padding:0 6px}
.clock b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock span{font-size:14px;color:var(--fg-2)}
.hdr-sep{width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}
.hdr-actions{display:flex;gap:10px}
.content{min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;border-radius:28px;scrollbar-gutter:stable}
.content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.page{height:100%;display:flex;flex-direction:column;gap:var(--gap)}
.page.enter{animation:pageIn .36s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card-title .th{font-size:21px;font-weight:700}
.card-title .en{font-size:15px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex:none}
.sec-t .th{font-size:22px;font-weight:700}

/* ---------- Buttons ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:8px 26px;border:0;border-radius:999px;font-size:19px;font-weight:600;transition:transform .16s var(--ease),background .2s,box-shadow .2s,filter .2s;user-select:none;text-align:left;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{flex:none}
.btn .bi{line-height:1.2}
.btn .bi .en{font-size:14px;font-weight:400}
.btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 88%,#fff),var(--primary));color:var(--on-primary);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px color-mix(in srgb,var(--primary) 32%,transparent)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary .bi .en{color:var(--on-primary);opacity:.82}
.btn-tonal{background:var(--primary-soft);color:var(--primary)}
.btn-tonal .bi .th{color:var(--primary)}
.btn-plain{background:var(--surface-2);color:var(--fg)}
.btn-glass{background:var(--glass-strong);color:var(--fg);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 8px rgba(20,40,90,.06)}
.btn-danger{background:var(--leak-soft);color:var(--leak)}
.btn-danger .bi .th{color:var(--leak)}
.btn-lg{min-height:66px;padding:10px 30px}
.btn-block{width:100%;justify-content:flex-start}
.icon-btn{position:relative;overflow:hidden;width:54px;height:54px;border-radius:50%;border:0;background:var(--surface-2);display:inline-grid;place-items:center;color:var(--fg-2);flex:none;transition:transform .15s,background .2s}
.icon-btn:hover{background:var(--glass-strong)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.danger{color:var(--leak)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .55s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.link-btn{border:0;background:none;color:var(--primary);font-weight:600;padding:8px 4px;min-height:48px;font-size:16px}

/* ---------- Pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.pill .bi .th{font-weight:600;font-size:17px}
.pill.run{background:var(--run-soft)} .pill.run .th{color:var(--run)}
.pill.stop{background:var(--stop-soft)}
.pill.sm{padding:4px 14px 4px 4px;gap:8px}
.pill.sm .bi .th{font-size:16px}
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 12px;border-radius:999px;font-size:15px;font-weight:600;background:var(--surface-2);color:var(--fg-2);line-height:1.3}
.badge.abn{background:var(--abn-soft);color:var(--abn)}
.badge.ok{background:var(--run-soft);color:var(--run)}
.badge.blue{background:var(--primary-soft);color:var(--primary)}
.badge .en{font-weight:400;opacity:.85}

/* ---------- Dashboard (one screen at 1920x1080) ---------- */
.dash{flex:1;display:grid;grid-template-columns:minmax(380px,24%) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:var(--gap);min-height:820px}
.dash-left{display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.hero-v{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:26px 28px;overflow:hidden}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-label .th{font-size:22px;font-weight:700}
.hero-label .en{font-size:16px}
.tank-wrap{flex:1 1 0;min-height:200px;display:flex;align-items:center;justify-content:center;padding:4px 0}
.tank{height:100%;max-height:340px;width:auto;max-width:100%;display:block;overflow:visible}
.big-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-size:clamp(76px,5.4vw,112px);font-weight:700;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.big small{font-size:.38em;color:var(--fg-2);font-weight:600;letter-spacing:0}
.liters{font-size:17px;color:var(--fg-2);text-align:right;line-height:1.3;white-space:nowrap}
.liters b{display:block;color:var(--fg);font-size:26px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.hero-kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px;border-radius:var(--r-m);background:var(--surface-2)}
.hero-kv>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-kv .bi .th{font-size:15px;color:var(--fg-2);font-weight:500}
.hero-kv .bi .en{font-size:14px}
.hero-kv b{font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.updated{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:16px;color:var(--fg-2)}
.updated b{color:var(--fg);font-size:18px}
.alert-card{display:flex;flex-direction:column;gap:14px;padding:20px 22px;flex:none}
.alert-card.abn{background:linear-gradient(135deg,var(--abn-soft),transparent 70%),var(--card)}
.alert-row{display:flex;align-items:center;gap:14px}
.alert-card .th{font-size:19px;font-weight:700}
.alert-card.abn .alert-row .th{color:var(--abn)}
.alert-card .det{font-size:16px}
.dash-right{display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,.92fr);gap:var(--gap);min-height:0;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap)}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r-l)}
.kpi-h{display:flex;align-items:center;gap:12px;min-width:0}
.kpi-h .bi .th{font-size:18px;font-weight:600;white-space:nowrap}.kpi-h .bi .en{white-space:nowrap}
.kpi-v{font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-v .u{font-size:17px;font-weight:500;color:var(--fg-2);margin-left:4px}
.kpi-v.leak{color:var(--leak)}
.kpi-n{font-size:15px;color:var(--fg-2);line-height:1.3;margin-top:-4px}
.chart-card{display:flex;flex-direction:column;padding:22px 24px 18px;overflow:hidden}
.dash-bottom{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--gap);min-height:0}
.dash-bottom .card{display:flex;flex-direction:column;overflow:hidden}
.shifts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.shift{border-radius:var(--r-l);padding:16px 18px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.shift.cur-run{background:var(--run-soft);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--run) 25%,transparent)}
.shift.cur-stop{background:var(--stop-soft);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--stop) 25%,transparent)}
.shift-h{display:flex;align-items:center;gap:10px;min-width:0}.shift-h .bi{flex:none;white-space:nowrap}.shift-h .rt{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.shift-h .bi .th{font-size:19px;font-weight:700}
.shift-h .time{font-size:16px;color:var(--fg-2);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);flex:none}
.sbar i{display:block;height:100%}
.sbar .run{background:var(--run)} .sbar .stop{background:var(--stop);opacity:.55}
.sbar .miss{background:repeating-linear-gradient(135deg,var(--fg-3) 0 3px,transparent 3px 8px);opacity:.45}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv .bi .th{font-size:15px;color:var(--fg-2);font-weight:500}
.kv .bi .en{font-size:14px}
.kv .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .v .u{font-size:14px;font-weight:500;color:var(--fg-2);margin-left:2px}
.ops{font-size:15px;color:var(--fg-2);margin-top:auto}
.list-scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -8px;padding:0 8px}
.recent{display:flex;flex-direction:column;gap:4px}
.ev-line{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:var(--r-m);border:0;background:transparent;text-align:left;width:100%;position:relative;overflow:hidden;transition:background .2s}
.ev-line:hover{background:var(--surface-2)}
.ev-line .mid{flex:1;min-width:0}
.ev-line .mid .th{font-size:18px;font-weight:600}
.ev-line .when{font-size:15px;color:var(--fg-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt.pos{color:var(--refill)} .amt.neg{color:var(--leak)} .amt.neu{color:var(--fg-2)}
.empty{padding:28px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:10px;flex:none}
.lg{display:inline-flex;align-items:center;gap:8px;font-size:15px}
.lg i{display:inline-block;width:22px;height:12px;border-radius:6px}
.lg .bi{flex-direction:row;gap:6px;align-items:baseline}

/* ---------- Segmented ---------- */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:5px;border-radius:999px;background:var(--surface-2)}
.seg button{position:relative;overflow:hidden;border:0;background:transparent;border-radius:999px;min-height:52px;padding:6px 20px;color:var(--fg);transition:background .2s,box-shadow .2s}
.seg button .th{font-size:17px;font-weight:600}
.seg button .en{font-size:14px}
.seg button.on{background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 10px rgba(18,28,48,.1)}
.seg button.on .th{color:var(--primary)}
.custom-range{display:flex;gap:12px;margin:-4px 0 12px;flex:none}
.custom-range .field{flex:0 1 240px}

/* ---------- Chart ---------- */
.chart{position:relative;width:100%;min-height:220px;touch-action:pan-y}
.chart.fill{flex:1 1 0;min-height:220px;overflow:hidden}
.chart svg.ch{display:block;width:100%;height:auto;overflow:visible}
.ch-tip{position:absolute;z-index:4;pointer-events:none;background:var(--toast-bg);color:var(--toast-fg);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.35;white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:var(--shadow-up);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.ch-tip b{font-size:20px}
.ch-tip .en{color:var(--toast-en);font-size:14px}
.ch-tip.show{opacity:1}
.mk{position:absolute;width:36px;height:36px;padding:0;border:0;background:none;transform:translate(-50%,0);z-index:3;filter:drop-shadow(0 4px 6px rgba(18,28,48,.2));transition:transform .18s var(--ease);animation:mkIn .45s var(--ease) backwards}
.mk:hover{transform:translate(-50%,-2px) scale(1.12)}
.mk svg{width:36px;height:36px;display:block}
@keyframes mkIn{from{opacity:0;transform:translate(-50%,8px) scale(.6)}}
.ev-pop{position:absolute;z-index:6;width:300px;background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);border-radius:var(--r-m);padding:16px;box-shadow:var(--shadow-up);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
.ev-pop.show{opacity:1;transform:none}
.ev-pop .row{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:3px 0}
.ev-pop .row span:first-child{color:var(--fg-2)}

/* ---------- Panes (history / events / reports / export) ---------- */
.split{flex:1;display:grid;grid-template-columns:360px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:var(--gap);min-height:0}
.split3{flex:1;display:grid;grid-template-columns:320px minmax(0,1fr) minmax(420px,30%);grid-template-rows:minmax(0,1fr);gap:var(--gap);min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -10px;padding:2px 10px 10px}
.side-pane{display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.flabel .th{font-size:17px;font-weight:600}
.flabel .en{font-size:14px}
.inp,.sel{width:100%;min-height:58px;border-radius:var(--r-s);border:2px solid var(--line);background:var(--surface);padding:10px 16px;font-size:19px;color:var(--fg);transition:border-color .2s}
.inp:focus,.sel:focus{border-color:var(--primary);outline:none}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.chipset{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:6px 20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);transition:background .2s,border-color .2s}
.chip .th{font-size:17px;font-weight:600}
.chip.on{border-color:var(--primary);background:var(--primary-soft)}
.chip.on .th{color:var(--primary)}
.side-pane .chipset{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.side-pane .chip{justify-content:center;padding:6px 4px;text-align:center}.side-pane .chip .bi{align-items:center}
.side-pane .opt-row{min-height:62px;padding:10px 16px}
.stat-list{display:flex;flex-direction:column;gap:8px}
.stat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2)}
.stat .bi{flex:1}
.stat .bi .th{font-size:16px;font-weight:600}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.flt-list{display:flex;flex-direction:column;gap:6px}
.flt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:66px;padding:8px 14px 8px 8px;border-radius:var(--r-m);border:0;background:transparent;text-align:left;width:100%;transition:background .2s}
.flt:hover{background:var(--surface-2)}
.flt .bi{flex:1}
.flt .bi .th{font-size:18px;font-weight:600}
.flt .cnt{min-width:36px;padding:2px 10px;border-radius:999px;background:var(--surface-2);font-size:16px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.flt.on{background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-hi),0 4px 14px rgba(20,40,90,.08)}
.flt.on .th{color:var(--primary)}
.flt.on .cnt{background:var(--primary);color:var(--on-primary)}
.flt .ic-all{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}

/* history rows */
.rows-head{display:grid;grid-template-columns:var(--cols);gap:16px;padding:0 20px 10px;border-bottom:1px solid var(--line);margin-bottom:10px;flex:none}
.rows-head .bi .th{font-size:15px;font-weight:600;color:var(--fg-2)}
.rows-head .bi .en{font-size:14px}
.hist{--cols:96px 150px minmax(200px,1.3fr) 220px minmax(140px,.8fr) minmax(120px,1fr) 124px}
.day-h{display:flex;align-items:baseline;gap:12px;padding:16px 6px 8px;position:sticky;top:0;z-index:2;background:linear-gradient(var(--card) 70%,transparent)}
.day-h .th{font-size:21px;font-weight:700}
.day-h .count{margin-left:auto;font-size:15px;color:var(--fg-2)}
.rec{display:grid;grid-template-columns:var(--cols);gap:16px;align-items:center;min-height:78px;padding:10px 20px;border-radius:var(--r-m);background:var(--surface-2);margin-bottom:8px;transition:background .2s}
.rec:hover{background:var(--glass-strong)}
.rec .tm{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.rec .shf .th{font-size:16px}
.rec .lv{display:flex;align-items:center;gap:14px;min-width:0}
.rec .lv b{font-size:27px;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.rec .lv b small{font-size:.55em;color:var(--fg-2);font-weight:600}
.rec .lv .lit{font-size:15px;color:var(--fg-2);white-space:nowrap}
.mini{flex:1;min-width:60px;max-width:200px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#E9A52C,#F4C35A)}
.rec .op,.rec .note{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rec .note{color:var(--fg-2)}
.rec .acts{display:flex;gap:8px;justify-content:flex-end}
.miss-card{display:flex;align-items:center;gap:16px;min-height:70px;padding:10px 20px;margin-bottom:8px;border-radius:var(--r-m);border:2px dashed var(--line);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--surface-2) 10px 20px)}
.miss-card .bi .th{font-size:18px;font-weight:700}
.miss-card .t{margin-left:auto;font-size:17px;font-variant-numeric:tabular-nums;color:var(--fg-2);text-align:right}

/* timeline */
.tl-row{display:grid;grid-template-columns:78px 32px minmax(0,1fr);gap:10px}
.tl-t{text-align:right;padding-top:24px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tl-dot{position:relative;display:flex;justify-content:center}
.tl-dot::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--line);border-radius:2px}
.tl-dot i{position:relative;margin-top:30px;width:16px;height:16px;border-radius:50%;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.tl-card{margin:6px 0;display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r-l);background:var(--surface-2);border:2px solid transparent;text-align:left;width:100%;position:relative;overflow:hidden;transition:transform .16s var(--ease),background .2s,border-color .2s}
.tl-card:hover{background:var(--glass-strong)}
.tl-card:active{transform:scale(.99)}
.tl-card.sel{border-color:var(--primary);background:var(--glass-strong);box-shadow:0 6px 18px rgba(20,40,90,.1)}
.tl-card .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tl-card .mid .bi .th{font-size:19px;font-weight:700}
.tl-card .sub{font-size:16px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{display:flex;flex-direction:column;min-height:0}
.detail-h{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.detail-h .bi .th{font-size:24px;font-weight:700}
.detail-actions{display:flex;gap:10px;padding-top:16px;margin-top:auto;flex:none}
.detail-actions .btn{flex:1}

/* reports */
.rep-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rep-cell{background:var(--surface-2);border-radius:var(--r-m);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rep-cell .bi .th{font-size:16px;color:var(--fg-2);font-weight:500}
.rep-cell .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}

.mb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:18px;border-radius:var(--r-m);background:var(--surface-2)}
.mb .term{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 16px;border-radius:var(--r-s);background:var(--surface);min-width:124px;flex:1}

.mb .term .bi .th{font-size:15px;color:var(--fg-2);font-weight:500}
.mb .op{font-size:28px;font-weight:700;color:var(--fg-3);padding:0 2px}
.mb .term.res{background:var(--primary-soft)}
.mb .term.res .v{color:var(--primary)}
.mb-note{font-size:15px;color:var(--fg-2);margin-top:10px}
.rep-main{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.rep-two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--gap)}

/* export */
.opt-list{display:flex;flex-direction:column;gap:10px}
.opt-row{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:var(--r-m);background:var(--surface-2);cursor:pointer;min-height:70px}
.opt-row .bi{flex:1}

.switch{position:relative;width:60px;height:36px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:18px;background:var(--line);transition:background .2s}
.switch i::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch input:checked+i{background:var(--primary)}
.switch input:checked+i::after{transform:translateX(24px)}
.switch input:focus-visible+i{outline:3px solid var(--primary);outline-offset:2px}
.pv-panel{display:flex;flex-direction:column;min-height:0}
.pv-area{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border-radius:var(--r-m);background:var(--surface-2);padding:24px}
.pv-scale{transform-origin:top left;box-shadow:0 10px 40px rgba(18,28,48,.18);border-radius:4px;overflow:hidden}
.pv-box{margin:0 auto;overflow:hidden}
.sheet-list{display:flex;flex-wrap:wrap;gap:8px}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
.set-actions{display:flex;flex-wrap:wrap;gap:12px}

/* ---------- Modal (centered glass dialog) ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center}
.scrim-m{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:min(700px,calc(100% - 48px));max-height:calc(100% - 64px);overflow:auto;border-radius:32px;padding:28px 30px 0;transform:translateY(20px) scale(.97);opacity:0;transition:transform .34s var(--ease),opacity .25s;box-shadow:var(--shadow-up);overscroll-behavior:contain;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--glass-border)}
.sheet.wide{width:min(1100px,calc(100% - 48px))}
#modal-root.open .scrim-m{opacity:1}
#modal-root.open .sheet{transform:none;opacity:1}
.sheet-h{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.sheet-h .bi{flex:1}
.sheet-h .bi .th{font-size:26px;font-weight:700}
.sheet-h .bi .en{font-size:16px}
.sheet-body{display:flex;flex-direction:column;gap:18px;padding-bottom:8px}
.sheet-actions{position:sticky;bottom:0;display:flex;gap:12px;padding:18px 0 26px;margin-top:8px;background:linear-gradient(transparent,var(--glass-strong) 30%)}
.sheet-actions .btn{flex:1}
.lvl-ctl{display:flex;align-items:center;gap:14px}
.step{width:66px;height:66px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none;position:relative;overflow:hidden;color:var(--fg)}
.step:hover{background:var(--surface)}
.lvl-val{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px;border-radius:var(--r-m);background:var(--surface);padding:6px 12px;border:2px solid var(--line)}
.lvl-val:focus-within{border-color:var(--primary)}
.lvl-val input{width:4.2ch;border:0;background:transparent;font-size:56px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;padding:0;outline:none}
.lvl-val span{font-size:28px;color:var(--fg-2);font-weight:600}
.lvl-lit{text-align:center;font-size:16px;color:var(--fg-2)}
input[type=range].rng{width:100%;height:36px;accent-color:var(--primary)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-card{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-m);border:2px solid var(--line);background:var(--surface);min-height:78px;text-align:left;transition:border-color .2s,background .2s}
.opt-card .bi .th{font-size:18px;font-weight:700}
.opt-card[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt-card[aria-pressed="true"] .th{color:var(--primary)}
.opt-card .ck{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.opt-card[aria-pressed="true"] .ck{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pick{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:20px;border-radius:var(--r-l);background:var(--surface);border:2px solid transparent;min-height:180px;text-align:left;transition:transform .16s var(--ease),border-color .2s,box-shadow .2s}
.pick:hover{border-color:var(--primary);box-shadow:0 8px 24px rgba(20,40,90,.12)}
.pick:active{transform:scale(.97)}
.pick .bi .th{font-size:20px;font-weight:700}
.pick .d{font-size:15px;color:var(--fg-2);line-height:1.35}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding:16px 18px;border-radius:var(--r-m);background:var(--primary-soft)}
.calc .bi .th{font-size:16px;color:var(--fg-2);font-weight:500}
.calc .v{font-size:28px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.calc .arrow{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.form-err{color:var(--leak);font-size:16px;font-weight:600}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dl>div{background:var(--surface-2);border-radius:var(--r-s);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dl>div.full{grid-column:1/-1}
.dl .bi .th{font-size:15px;color:var(--fg-2);font-weight:500}
.dl .v{font-size:21px;font-weight:700;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;gap:10px}
.stepper input{text-align:center;font-weight:700;font-size:24px}
.stepper .step{width:58px;height:58px}
.pv-wrap{overflow:hidden;border-radius:var(--r-m);background:var(--surface-2);padding:12px}

/* ---------- Toast ---------- */
#toasts{position:fixed;right:32px;bottom:32px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:none;max-width:calc(100% - 64px)}
.toast{display:flex;align-items:center;gap:14px;padding:12px 26px 12px 12px;border-radius:var(--r-l);background:var(--toast-bg);color:var(--toast-fg);box-shadow:var(--shadow-up);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);animation:tIn .4s var(--ease) both}
.toast.out{animation:tOut .3s ease forwards}
.toast .bi .th{font-size:18px;font-weight:700}
.toast .bi .en{color:var(--toast-en)}
.toast .det{font-size:16px;color:var(--toast-en);font-variant-numeric:tabular-nums}
.toast .det b{color:var(--toast-fg);font-size:18px}
@keyframes tIn{from{opacity:0;transform:translateX(30px) scale(.96)}}
@keyframes tOut{to{opacity:0;transform:translateX(20px)}}

/* ---------- Report paper (fixed light look for print/PDF) ---------- */
.paper{--s-servo:#4F7FEA;--s-auxiliary:#1E9E91;--s-lubrication:#D69330;--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F3F5F9;--card:#FFFFFF;--line:#DDE2EA;--fg:#121821;--fg-2:#566070;--fg-3:#838C9B;--primary:#2A64E8;--primary-soft:#E4ECFD;--run:#17904F;--stop:#667082;--leak:#D23A40;--refill:#0B8F73;--abn:#D9640F;--low:#B87E00;--night-band:rgba(52,72,120,.055);--grid:#E4E8EF;
  width:794px;background:#FFFFFF;color:#121821;padding:44px 40px 36px;font-family:var(--font);font-size:13px;line-height:1.45;color-scheme:light}
.paper .pp-head{display:flex;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:2px solid #121821}

.paper .pp-meta{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:12.5px;align-content:start}

.paper h3{font-size:15px;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}

.paper .pp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.paper .pp-c{border:1px solid #DDE2EA;border-radius:12px;padding:10px 12px}
.paper .pp-c .l{font-size:12px;color:#566070;line-height:1.3}
.paper .pp-c .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.paper .pp-mb{margin-top:8px;padding:10px 12px;border-radius:12px;background:#F3F5F9;font-size:12.5px;font-variant-numeric:tabular-nums}
.paper table{width:100%;border-collapse:collapse;font-size:12px}
.paper th{text-align:left;font-weight:600;color:#566070;padding:7px 8px;border-bottom:1.5px solid #121821;vertical-align:bottom;line-height:1.3}
.paper th .en{display:block;font-weight:400;font-size:11px}
.paper td{padding:7px 8px;border-bottom:1px solid #DDE2EA;vertical-align:top;font-variant-numeric:tabular-nums}
.paper .pp-foot{margin-top:24px;padding-top:10px;border-top:1px solid #DDE2EA;display:flex;justify-content:space-between;font-size:11.5px;color:#566070}
.paper .chart{min-height:0}
.paper .mk{animation:none;filter:none}

/* ---------- Multi-system dashboard ---------- */

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

const fD=ts=>{const d=new Date(ts);return d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543)};

const parseYmd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getTime()};
const toLI=ts=>ymd(ts)+'T'+fT(ts);
const fromLI=s=>{if(!s)return NaN;const [d,t]=s.split('T');const p=d.split('-').map(Number);const q=(t||'0:0').split(':').map(Number);return new Date(p[0],p[1]-1,p[2],q[0],q[1]).getTime()};

function segments(a,b,id){
  const rs=recs(id),now=Date.now(),end=Math.min(b,now),G=CFG.gapH*H,out=[];if(end<=a)return out;
  const push=(f,t,k)=>{if(t-f<=0)return;const l=out[out.length-1];if(l&&l.k===k&&Math.abs(l.t-f)<1)l.t=t;else out.push({f,t,k})};
  const pr=recAtOrBefore(a,id);const seq=(pr?[pr]:[]).concat(rs.filter(r=>r.ts>a&&r.ts<=end));
  if(!seq.length){push(a,end,'miss');return out}if(!pr)push(a,seq[0].ts,'miss');
  for(let i=0;i<seq.length;i++){const s=seq[i],nx=seq[i+1];const f=Math.max(s.ts,a);
    if(nx){const t=Math.min(nx.ts,end);if(nx.ts-s.ts>G)push(f,t,'miss');else push(f,t,s.status)}
    else{const ok=Math.min(end,s.ts+G);push(f,ok,s.status);push(Math.max(f,ok),end,'miss')}}
  return out}
function statsWin(a,b,id){
  let run=0,stop=0,miss=0;segments(a,b,id).forEach(s=>{const d=s.t-s.f;if(s.k==='run')run+=d;else if(s.k==='stop')stop+=d;else miss+=d});
  const end=Math.min(b,Date.now());const prev=recAtOrBefore(a,id);const inW=recs(id).filter(r=>r.ts>a&&r.ts<=end);
  const openR=prev||inW[0]||null,closeR=inW.length?inW[inW.length-1]:prev;

  parts.forEach(p=>{['run','stop','miss','refill','ocAdded','ocDrained','ocNet','leak','drain','adj'].forEach(k=>o[k]+=p[k]);if(p.cons!=null)o.cons=(o.cons||0)+p.cons;o.events=o.events.concat(p.events);o.records=o.records.concat(p.records)});

  if(o.abnormal)h+=`<h3 class="avoid">${T('incAbnormal').replace('แสดง','')} <span class="en">${S2('incAbnormal')}</span></h3><table><thead><tr class="avoid">${['date','system','interval','level','dropRate','status','cause'].map(th).join('')}</tr></thead><tbody>${D.abn.map(e=>`<tr class="avoid"><td>${fDs(e.ts)} ${fT(e.ts)}</td><td>${dot(e.systemType)}${esc(T('short_'+e.systemType))}</td><td>${e.fromTs?fT(e.fromTs)+' → '+fT(e.ts):'—'}</td><td>${fLit(e.beforeLevel)} → ${fLit(e.afterLevel)} L</td><td>${e.rate!=null?fL(e.rate)+' L/h':'—'}</td><td>${H2(e.eventType==='abnormal'?(e.status==='normal'?'reviewedNormal':e.status==='error'?'reviewedError':'investigate'):'confirmedLeak')}</td><td>${esc([e.cause,e.action].filter(Boolean).join(' · '))||'—'}</td></tr>`).join('')||`<tr><td colspan="7">—</td></tr>`}</tbody></table>`;

/* live: effective price + change badges for one oil card, from what is typed */
function refreshPriceBadges(oilId){const card=$(`.oil-card[data-oil="${oilId}"]`);if(!card)return;const base=parseFloat($('#s-price-'+oilId).value);const own={};
  $$('.pm-in',card).forEach(i=>{const v=parseFloat(i.value);if(i.value.trim()!==''&&!isNaN(v))own[i.dataset.ym]=v});
  const eff=ym=>{if(own[ym]!=null)return own[ym];let best=null;Object.keys(own).forEach(k=>{if(k<ym&&(!best||k>best))best=k});return best?own[best]:(isNaN(base)?0:base)};
  $$('.pm-in',card).forEach(i=>{const ym=i.dataset.ym;const p=eff(ym);i.placeholder=p;const vi=i.parentNode.querySelector('.pm-vin');if(vi)vi.placeholder=withVat(p);i.closest('.pm-cell').classList.toggle('own',own[ym]!=null);const pr=ym<=RECORD_START.slice(0,7)?p:eff(prevYm(ym));const b=card.querySelector(`[data-b="${oilId}|${ym}"]`);if(b)b.innerHTML=priceBadge(withVat(p)-withVat(pr),true)})}

/* ================= central data file (desktop): shared by every PC ================= */
const SYNC={on:false,rev:0,state:'local',pending:false,busy:false,last:0,base:null,info:null,needRender:false,poll:null};
const _js=o=>JSON.stringify(o);
function syncSnapshot(){const m=a=>{const o=new Map();a.forEach(x=>o.set(x.id,_js(x)));return o};return {cfg:_js(CFG),oils:_js(OILS),rec:m(REC),evt:m(EVTS)}}
function syncHasLocal(){const b=SYNC.base;if(!b)return true;if(_js(CFG)!==b.cfg||_js(OILS)!==b.oils||REC.length!==b.rec.size||EVTS.length!==b.evt.size)return true;
  return REC.some(r=>b.rec.get(r.id)!==_js(r))||EVTS.some(e=>b.evt.get(e.id)!==_js(e))}
/* 3-way merge: start from the other PCs' file, re-apply what changed on this PC since the last sync */
function syncMerge(remote){const b=SYNC.base||{cfg:null,oils:null,rec:new Map(),evt:new Map()};
  const items=(loc,rem,base)=>{const out=new Map();(rem||[]).forEach(x=>x&&x.id&&out.set(x.id,x));const ids=new Set(loc.map(x=>x.id));
    loc.forEach(x=>{if(base.get(x.id)!==_js(x))out.set(x.id,x)});base.forEach((v,id)=>{if(!ids.has(id))out.delete(id)});return [...out.values()]};
  REC=items(REC,remote.records,b.rec);EVTS=items(EVTS,remote.events,b.evt);
  if(remote.config&&_js(CFG)===b.cfg){CFG=mergeCfg(remote.config);SHIFT_CFG=CFG.shift}
  if(Array.isArray(remote.oils)&&_js(OILS)===b.oils)OILS=mergeOils(remote.oils);migrate();inval()}
function syncAdopt(remote){REC=Array.isArray(remote.records)?remote.records.filter(validRec):[];EVTS=Array.isArray(remote.events)?remote.events.filter(validEvt):[];
  if(remote.config){CFG=mergeCfg(remote.config);SHIFT_CFG=CFG.shift}if(Array.isArray(remote.oils))OILS=mergeOils(remote.oils);migrate();inval()}
function syncSaveLocal(){store.set(K_CONFIG,_js(CFG));store.set(K_OIL,_js(OILS));store.set(K_REC,_js(REC));store.set(K_EVT,_js(EVTS))}

function syncRender(){if($('#modal-root')&&!$('#modal-root').hidden||hasUnsaved()){SYNC.needRender=true;return}SYNC.needRender=false;render(false,false)}
let _syncT=null;
function syncSoon(){if(!SYNC.on)return;SYNC.pending=true;syncRefreshUI();clearTimeout(_syncT);_syncT=setTimeout(syncPush,350)}
async function syncPush(){if(!SYNC.on)return;if(SYNC.busy){clearTimeout(_syncT);_syncT=setTimeout(syncPush,400);return}SYNC.busy=true;SYNC.state='saving';syncRefreshUI();let merged=false;
  try{for(let i=0;i<4;i++){const r=await PYW().data_save(_js(dataPayload()),SYNC.rev);
      if(r&&r.ok){SYNC.rev=r.rev;SYNC.base=syncSnapshot();SYNC.pending=false;SYNC.state='ok';SYNC.last=Date.now();SYNC.by=r.savedBy;break}
      if(r&&r.conflict){syncMerge(JSON.parse(r.text));SYNC.rev=r.rev;merged=true;continue}
      if(r&&r.busy){await new Promise(z=>setTimeout(z,600));continue}
      throw new Error((r&&r.error)||'save failed')}
    if(SYNC.pending)SYNC.state='offline'}
  catch(e){console.error(e);SYNC.state='offline'}
  finally{SYNC.busy=false;syncSaveLocal();syncRefreshUI();if(merged)syncRender()}}
function syncFlush(timeout){return new Promise(res=>{const t0=Date.now();clearTimeout(_syncT);if(SYNC.on&&SYNC.pending&&!SYNC.busy)syncPush();
  const w=()=>{if(!SYNC.on||(!SYNC.pending&&!SYNC.busy)||Date.now()-t0>(timeout||8000))res(!SYNC.pending);else setTimeout(w,120)};w()})}
async function syncPoll(){if(!SYNC.on||SYNC.busy)return;try{const r=await PYW().data_rev();if(!r||!r.ok){SYNC.state='offline';syncRefreshUI();return}
    if(SYNC.state==='offline'){SYNC.state='ok'}
    if(r.rev!==SYNC.rev){const ld=await PYW().data_load();if(ld&&ld.ok&&ld.text){const remote=JSON.parse(ld.text);
        if(syncHasLocal()){syncMerge(remote);SYNC.rev=ld.rev;syncSoon()}else{syncAdopt(remote);SYNC.rev=ld.rev;SYNC.base=syncSnapshot();SYNC.last=Date.now()}
        syncSaveLocal();syncRender()}}
    else if(SYNC.pending)syncPush();
    syncRefreshUI()}catch(e){SYNC.state='offline';syncRefreshUI()}}
async function syncInit(){const api=PYW();if(!api||!api.storage_info){tryRestoreBackup();return}
  try{const info=await api.storage_info();SYNC.info=info;if(!info||!info.ok||!info.writable){SYNC.state='offline';tryRestoreBackup();updateSyncChip();return}
    const ld=await api.data_load();SYNC.on=true;
    if(ld&&ld.ok&&ld.text){syncAdopt(JSON.parse(ld.text));SYNC.rev=ld.rev;SYNC.base=syncSnapshot();SYNC.state='ok';SYNC.last=Date.now();syncSaveLocal();render(false,true)}
    else{SYNC.rev=0;SYNC.base=null;await syncPush()}   // first PC: the shared file starts from this PC's data
    clearInterval(SYNC.poll);SYNC.poll=setInterval(syncPoll,15000)}
  catch(e){console.error(e);SYNC.state='offline';tryRestoreBackup()}updateSyncChip()}

    if(rows.length||evs.length||logs.length){const {n,found}=mobImport(rows);const ne=mobImportEvents(evs);const nl=mobImportLogs(logs);if(n||ne){commit()}else if(nl){saveAll();syncSoon()}if(nl&&UI.page==='settings'){const card=$('#mob-card');if(card)card.outerHTML=mobCardHTML()}await mobCall({action:'ack',key:c.key,ids:rows.concat(evs,logs).map(r=>r.id).join(','),by:(SYNC.info&&SYNC.info.computer)||'PC'});MOB.lastN=n+ne;
      if(n||ne)toast('brand','mobImported',esc([n?T('mobImportedD',{n}):'',ne?T('mobRefillD',{n:ne}):''].filter(Boolean).join(' · ')));

function mobRefreshUI(){const c=$('#mob-card');if(c&&UI.page==='settings'){const s=$('#mob-status');if(s)s.innerHTML=mobStatusHTML()}}

function mobReadForm(){const c=mobCfg();const u=$('#mob-url'),k=$('#mob-key'),o=$('#mob-on'),pg=$('#mob-page');if(u)c.url=u.value.trim();if(pg)c.page=pg.value.trim();if(k)c.key=k.value.trim();if(o)c.on=o.checked}
Object.assign(A,{
  mobTest:async()=>{mobReadForm();const c=mobCfg();if(!c.url||!c.key){toast('abnormal','mobNotSet','');return}try{const o=await mobCall({action:'ping',key:c.key});if(o.team)c.team=String(o.team);mobSendNames(true);saveAll();syncSoon();savedPop('brand','mobTestOk',esc(T('mobTestOkD',{n:o.rows,m:o.machine||''})));MOB.err='';if(UI.page==='settings'){const card=$('#mob-card');if(card)card.outerHTML=mobCardHTML()}}catch(e){MOB.err=String(e.message||e);mobRefreshUI();toast('abnormal','mobFail',esc(T('mobErr_'+MOB.err)!=='mobErr_'+MOB.err?T('mobErr_'+MOB.err):MOB.err))}},

      <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px"><div style="width:110px">${mobQR(chk)}</div><div style="text-align:left;font-size:14px"><b>เช็กมือถือ</b><br>Phone check</div></div><script>setTimeout(()=>print(),300)<\/script></body>`);w.document.close()}});

/* start-up safety (v1.7.1): errors go to error.log, a broken start never leaves a blank window */
const _logQ=[];function hrmLog(m){m=String(m).slice(0,1500);try{const a=PYW();if(a&&a.log_js){a.log_js(m);return}}catch(_){}_logQ.push(m)}
window.addEventListener('error',e=>hrmLog('error: '+(e.message||'')+' line '+(e.lineno||'')+':'+(e.colno||'')+(e.error&&e.error.stack?' | '+e.error.stack:'')));
window.addEventListener('unhandledrejection',e=>hrmLog('promise: '+String((e.reason&&e.reason.stack)||e.reason)));
let BOOT_OK=false,_readySent=false;
function hrmReady(){const a=PYW();if(!a||!a.app_ready||_readySent)return;_readySent=true;try{a.app_ready(BOOT_OK);_logQ.splice(0).forEach(m=>a.log_js(m))}catch(_){}}
function bootFail(where,e){hrmLog('boot '+where+': '+((e&&e.stack)||e));
  const box=document.createElement('div');box.id='boot-fail';box.style.cssText='position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#E9EDF4;font-family:Thonburi,"Noto Sans Thai",Tahoma,sans-serif;color:#111722';
  box.innerHTML='<div style="max-width:560px;padding:28px 32px;border-radius:24px;background:#fff;box-shadow:0 12px 32px rgba(18,28,48,.12)"><h2 style="margin:0 0 8px">กำลังซ่อมโปรแกรม…</h2><p style="margin:0 0 6px">โปรแกรมเปิดไม่สมบูรณ์ ระบบจะล้างแคชหน้าจอและเปิดใหม่ให้อัตโนมัติ ข้อมูลในไฟล์กลางไม่หาย</p><p style="margin:0;color:#535D6D">Repairing the program window. It will reopen automatically; your shared data is safe.</p><p style="margin:14px 0 0;font-size:12px;color:#828B9A">'+esc(String((e&&e.message)||e))+'</p></div>';
  document.body.appendChild(box)}
/* recorder names: capital letters only, chosen from the list; type 1 letter → suggestions */
let _sg=null,_sgSkip=false;
function sgClose(){if(_sg){_sg.el.remove();_sg=null}}
function sgOpen(inp){if(_sgSkip)return;const typed=inp.selectionStart!=null&&inp.selectionEnd>inp.selectionStart?inp.value.slice(0,inp.selectionStart):inp.value;const q=normRec(typed),all=recList();
  const pre=all.filter(n=>n.startsWith(q)),m=!q?all.slice():pre.length?pre:all.filter(n=>n.includes(q));
  if(!m.length||(m.length===1&&m[0]===normRec(inp.value)&&m[0]===q)){sgClose();return}
  if(!_sg||_sg.inp!==inp){sgClose();const el=document.createElement('div');el.className='rec-sg';el.setAttribute('role','listbox');document.body.appendChild(el);_sg={el,inp,i:0}}
  _sg.items=m;_sg.i=q?0:Math.min(_sg.i,m.length-1);sgDraw(q);sgPos()}
function sgPos(){if(!_sg)return;const inp=_sg.inp;if(!document.body.contains(inp)){sgClose();return}const r=inp.getBoundingClientRect();if(r.bottom<0||r.top>window.innerHeight){sgClose();return}
  const h=Math.min(266,_sg.items.length*38+10),below=window.innerHeight-r.bottom>h+8;
  Object.assign(_sg.el.style,{left:Math.max(8,Math.min(r.left,window.innerWidth-210))+'px',top:(below?r.bottom+4:Math.max(8,r.top-h-4))+'px',minWidth:Math.max(150,r.width)+'px'})}
function sgDraw(q){const ip=_sg.inp;q=q==null?normRec(ip.selectionStart!=null&&ip.selectionEnd>ip.selectionStart?ip.value.slice(0,ip.selectionStart):ip.value):q;
  _sg.el.innerHTML=_sg.items.map((n,j)=>{const k=q&&n.startsWith(q)?q.length:0;return `<button type="button" role="option" aria-selected="${j===_sg.i}" class="${j===_sg.i?'on':''}" data-n="${n}"><b>${esc(n.slice(0,k))}</b>${esc(n.slice(k))}</button>`}).join('');
  const on=_sg.el.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'})}
function sgPick(n){if(!_sg)return;const inp=_sg.inp;inp.value=n;sgClose();_sgSkip=true;try{inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}))}finally{_sgSkip=false}}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.matches&&t.matches('[data-rec]'))setTimeout(()=>teamFollow(t),0)},true);
function teamFollow(t){const tm=teamOf(t.value);if(/^r4-rec-/.test(t.id||'')){const b=$('#r4-team-'+t.id.slice(7));if(b){if(tm){b.dataset.v=tm;b.textContent=tm}else{b.textContent=b.dataset.v||'—'}}}
  else if(t.classList.contains('ms-in')){const c=$(`.msheet .ms-in[data-r="${t.dataset.r}"].team`);if(c&&tm&&c.value!==tm){c.value=tm;c.dispatchEvent(new Event('input',{bubbles:true}))}}}
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.matches||!t.matches('[data-rec]'))return;const u=t.value.toUpperCase().replace(/\s+/g,'');if(u!==t.value){const p=t.selectionStart;t.value=u;try{t.setSelectionRange(p,p)}catch(_){}}
  if(!_sgSkip&&e.inputType&&e.inputType.indexOf('insert')===0&&u&&t.selectionStart===u.length){const hit=recList().find(n=>n.startsWith(u));if(hit&&hit!==u){t.value=hit;try{t.setSelectionRange(u.length,hit.length)}catch(_){}}}
  sgOpen(t)},true);
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.matches&&t.matches('[data-rec]:not(.ms-in)')&&!t.disabled)sgOpen(t)});
document.addEventListener('focusout',e=>{if(_sg&&e.target===_sg.inp)setTimeout(()=>{if(_sg&&document.activeElement!==_sg.inp)sgClose()},120)});
document.addEventListener('keydown',e=>{if(!_sg||e.target!==_sg.inp)return;const grid=_sg.inp.classList.contains('ms-in');
  if(!grid&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();_sg.i=(_sg.i+(e.key==='ArrowDown'?1:-1)+_sg.items.length)%_sg.items.length;sgDraw();return}
  if(e.key==='Enter'||e.key==='Tab'){const q=normRec(_sg.inp.value);if(q||!grid){if(!grid&&e.key==='Enter')e.preventDefault();sgPick(_sg.items[_sg.i])}else sgClose();return}
  if(e.key==='Escape'){e.stopPropagation();sgClose()}},true);
document.addEventListener('mousedown',e=>{const b=e.target.closest&&e.target.closest('.rec-sg button');if(b){e.preventDefault();sgPick(b.dataset.n);return}if(_sg&&!(e.target.closest&&e.target.closest('.rec-sg'))&&e.target!==_sg.inp)sgClose()},true);

})();
if(PYW()&&PYW().app_ready)startSync();
window.__i18nMissing=_miss;
})();
