<style>

.wrap{max-width:560px;margin:0 auto;padding:14px 14px 150px}
.top{display:flex;align-items:center;gap:12px;margin:4px 2px 14px}

input.bad{border-color:var(--bad);background:#FDF0F0}

.sys{border-left:5px solid var(--c);padding-left:12px}

.last{font-size:12.5px;color:var(--fg2);margin-top:6px}

.ok{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:#E3F5EB;display:grid;place-items:center}

.mode button small{display:block;font-size:11px;font-weight:600;opacity:.75}

.tankunit{display:block;text-align:center;margin-top:4px;font-size:13px;color:var(--fg2);font-weight:600}

.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.ck:first-child{border-top:0}

.ck b{display:block;font-size:15px}.ck span{display:block;font-size:13.5px;color:var(--fg2)}

.ua{font-size:12px;color:var(--fg2);word-break:break-all}
.rec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rec-chips button{border:1.5px solid var(--line);background:#fff;border-radius:12px;min-height:40px;padding:6px 12px;font:inherit;font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--fg2)}
.rec-chips button b{color:var(--pri);font-weight:800}
.rec-chips button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-s);color:var(--pri)}
.rec-chips span{font-size:13px;color:var(--bad)}
.recent b{display:flex;flex-direction:column;gap:6px}
.rx{display:flex;gap:6px;font-style:normal}
.recent .lg b,.recent .lg span{color:var(--fg3)}.recent .lg span{text-decoration:line-through;text-decoration-color:rgba(130,139,154,.6)}.recent .lg i{font-style:normal;font-weight:700;color:var(--warn);text-decoration:none;display:inline-block}

.rx button[data-x="del"]{color:var(--bad)}
.ask-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ask-b .btn{height:50px;font-size:15.5px}
.btn.danger{background:linear-gradient(180deg,#E25156,#D23A40);box-shadow:0 10px 24px rgba(210,58,64,.28)}
</style>
</head>
