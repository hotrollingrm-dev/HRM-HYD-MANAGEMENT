<style>
@font-face{font-family:Chakra;font-weight:600;font-display:swap;src:url(fonts/chakra-petch-thai-600-normal.woff2) format('woff2');unicode-range:U+0E00-0E7F}
@font-face{font-family:Chakra;font-weight:600;font-display:swap;src:url(fonts/chakra-petch-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:Chakra;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-thai-700-normal.woff2) format('woff2');unicode-range:U+0E00-0E7F}
@font-face{font-family:Chakra;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212}
@font-face{font-family:Plex;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-thai-thai-400-normal.woff2) format('woff2');unicode-range:U+0E00-0E7F}
@font-face{font-family:Plex;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-thai-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Plex;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-thai-thai-600-normal.woff2) format('woff2');unicode-range:U+0E00-0E7F}
@font-face{font-family:Plex;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-thai-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
:root{color-scheme:dark;
  --bg:#16191E;--pan-t:#2C3139;--pan-b:#1F2329;--line:#3A414B;--hi:rgba(255,255,255,.07);--well:#13161B;--well-line:#2D333C;
  --fg:#E7EBF1;--fg2:#9AA3B0;--fg3:#69727F;--pri:#5CE1FF;--pri-s:rgba(92,225,255,.16);--run:#43E08A;--stop:#FF7A5C;--bad:#FF5A5F;--warn:#FFB547;
  --servo:#5B9BFF;--aux:#2FD3C0;--lub:#FFB547;--r:16px;
  --ease-enter:cubic-bezier(.22,1,.36,1);--ease-move:cubic-bezier(.25,1,.5,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--ease-expo:cubic-bezier(.19,1,.22,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Plex,Thonburi,"Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 70% at 50% 0%,#2E343D 0%,#1A1D23 55%,#121418 100%) fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.num,.fv{font-family:Chakra,Plex,monospace;font-variant-numeric:tabular-nums}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 12px 150px}
.top{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(180deg,#3A414B,#22262D);border:1px solid var(--line);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 var(--hi),0 0 16px rgba(92,225,255,.18)}
.logo svg path{fill:var(--pri)}
.top h1{margin:0;font-family:Chakra,Plex,sans-serif;font-weight:700;font-size:19px;line-height:1.15;letter-spacing:.03em}.top small{display:block;font-size:12px;color:var(--fg2);font-weight:400}
.card{position:relative;background:linear-gradient(180deg,var(--pan-t),var(--pan-b));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),0 12px 28px rgba(0,0,0,.42),0 2px 4px rgba(0,0,0,.3);padding:12px;margin-bottom:12px}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.045),transparent 35%)}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ph h2{margin:0;font-family:Chakra,Plex,sans-serif;font-weight:600;font-size:15px;letter-spacing:.03em;color:#DCE1E8}.ph small{font-size:11.5px;color:var(--fg3)}
.dots{margin-left:auto;display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:#4A515C}
.dots i:nth-child(1){background:var(--stop);box-shadow:0 0 6px var(--stop)}.dots i:nth-child(2){background:#FFC53D;box-shadow:0 0 6px #FFC53D}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--fg2);margin:0 0 6px}.lbl span{font-weight:400;color:var(--fg3);margin-left:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;height:50px;border:1px solid var(--well-line);border-radius:12px;background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.5);padding:0 14px;font:inherit;font-size:18px;color:var(--fg);outline:none;-webkit-appearance:none;appearance:none;transition:border-color 200ms,box-shadow 200ms}
input::placeholder{color:#4A525E}
input[type=date]{font-family:Chakra,Plex,sans-serif;font-weight:600}
#f-time{font-family:Chakra,Plex,sans-serif;font-weight:600;letter-spacing:.04em}
select.bad,input.bad,textarea.bad{border-color:var(--bad)!important;box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 0 0 3px rgba(255,90,95,.25)!important;animation:shake 220ms cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{25%{transform:translateX(4px)}50%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 0 0 3px var(--pri-s)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:13px;background:var(--well);border:1px solid var(--well-line);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.seg button{height:46px;line-height:1.15;border:0;border-radius:10px;background:transparent;font:inherit;font-family:Chakra,Plex,sans-serif;font-size:15px;font-weight:600;color:var(--fg3);touch-action:manipulation;transition:transform 140ms var(--ease-enter),background-color 200ms,color 200ms,box-shadow 200ms}
.seg button:active{transform:scale(.96);transition-duration:0s}
.seg button small{display:block;font-family:Plex,sans-serif;font-size:11px;font-weight:400;opacity:.75;margin-top:1px}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#3A414B,#2B3038);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.4)}
#seg-shift button[data-v="day"][aria-pressed="true"]{color:#FFD08A}#seg-shift button[data-v="night"][aria-pressed="true"]{color:#B9B5FF}
.seg.st button[data-v="run"][aria-pressed="true"]{color:#06210F;background:linear-gradient(180deg,#5BEA9C,#2FBF6E);box-shadow:0 0 14px rgba(67,224,138,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.seg.st button[data-v="stop"][aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,#FF7A5C,#E2533A);box-shadow:0 0 14px rgba(255,120,80,.4)}
.team-badge{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--well);border:1px solid var(--well-line);color:var(--fg3);font-size:13.5px;font-weight:600}
.team-badge.on{color:#1A1300;background:#FFC53D;border-color:#FFC53D;font-family:Chakra,Plex,sans-serif;font-weight:700;box-shadow:0 0 12px rgba(255,197,61,.35);display:inline-block}
.hint{font-size:12.5px;color:var(--fg3);margin:6px 2px 0}
.unit{position:relative}.unit input{padding-right:46px;text-align:right;font-family:Chakra,Plex,sans-serif;font-size:22px;font-weight:700}
.unit i{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:600;color:var(--fg3);pointer-events:none}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:60px;border:0;border-radius:16px;font:inherit;font-family:Chakra,Plex,sans-serif;font-size:19px;font-weight:700;letter-spacing:.02em;color:#fff;
  background:linear-gradient(180deg,#2E86FF,#1B5FD6);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 24px rgba(46,134,255,.4),0 8px 18px rgba(0,0,0,.5);touch-action:manipulation;transition:transform 160ms var(--ease-enter),filter 200ms}
.btn:active{transform:scale(.97);transition-duration:0s}
.btn:disabled{filter:saturate(.4) brightness(.8)}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
.btn.ready::before{animation:sweep 2.6s var(--ease-move) infinite}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn .ring{position:absolute;right:10px;top:50%;margin-top:-21px;width:42px;height:42px}
.btn.ghost{background:var(--well);color:var(--fg);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);border:1px solid var(--well-line);height:48px;font-size:15.5px}
.btn.ghost::before{display:none}
.btn.act{background:linear-gradient(180deg,#36C77E,#1F9A5B);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 22px rgba(67,224,138,.35),0 8px 18px rgba(0,0,0,.5)}
.btn.danger{background:linear-gradient(180deg,#FF6B6F,#D9363C);box-shadow:0 0 20px rgba(255,90,95,.35)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(18,20,24,0),rgba(18,20,24,.94) 32%)}
.bar .in{max-width:560px;margin:0 auto}
.err{display:none;margin:0 0 10px;padding:10px 12px;border-radius:12px;background:rgba(255,90,95,.14);border:1px solid rgba(255,90,95,.5);color:#FFB3B5;font-weight:600;font-size:14px}
.pend{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:10px 12px;border-radius:13px;background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.45);color:#FFD08A;font-weight:600;font-size:14px}
.pend button{border:0;border-radius:10px;padding:8px 12px;background:#FFB547;font:inherit;font-weight:700;color:#2A1800}
.recent div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--well-line);font-size:13.5px}.recent div:first-child{border-top:0}
.recent b{font-family:Chakra,Plex,sans-serif;font-weight:600;display:flex;flex-direction:column;gap:6px}.recent span{color:var(--fg2);text-align:right}
.recent .lg b,.recent .lg span{color:var(--fg3)}.recent .lg span{text-decoration:line-through;text-decoration-color:rgba(130,139,154,.6)}.recent .lg i{font-style:normal;font-weight:700;color:var(--warn);text-decoration:none;display:inline-block}
.rx{display:flex;gap:6px;font-style:normal}
.rx button{border:1px solid var(--well-line);background:var(--well);border-radius:9px;padding:5px 10px;font:inherit;font-size:13px;font-weight:600;color:var(--pri)}
.rx button[data-x="del"]{color:var(--bad)}
.pop{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:radial-gradient(70% 50% at 50% 45%,rgba(26,52,40,.9),rgba(10,12,16,.94));z-index:20}
.pop .box{width:100%;max-width:420px;background:linear-gradient(180deg,#2C3139,#1E2228);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:popin 420ms var(--ease-expo) both}
@keyframes popin{from{opacity:0;transform:scale(.94)}}
.okc{width:96px;height:96px;margin:0 auto 12px}
.okc .c{stroke-dasharray:280;stroke-dashoffset:280;animation:draw 600ms var(--ease-enter) forwards}
.okc .k{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 420ms var(--ease-enter) 380ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop h3{margin:0 0 4px;font-family:Chakra,Plex,sans-serif;font-weight:700;font-size:22px;color:#DFFFEA}.pop p{margin:0 0 16px;color:var(--fg2);font-size:14.5px;line-height:1.55}
.gate{max-width:420px;margin:12vh auto 0}
.gate h2{margin:0 0 4px;font-family:Chakra,Plex,sans-serif;font-size:20px}.gate p{margin:0 0 14px;color:var(--fg2);font-size:14px}
.gate input{text-align:center;letter-spacing:.3em;font-family:Chakra,Plex,sans-serif;font-size:26px;font-weight:700;margin-bottom:12px;height:58px}
.who{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--fg3);margin:0 2px 10px}.who button{border:0;background:none;color:var(--pri);font:inherit;font-weight:600}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:var(--well);border:1px solid var(--well-line);margin-bottom:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.mode button{height:52px;border:0;border-radius:11px;background:transparent;font:inherit;font-family:Chakra,Plex,sans-serif;font-size:16px;font-weight:700;color:var(--fg3);display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;transition:background-color 200ms,color 200ms}
.mode button small{display:block;font-family:Plex,sans-serif;font-size:11px;font-weight:400;opacity:.75}
.mode button[aria-pressed="true"]{background:linear-gradient(180deg,#3A414B,#2B3038);color:var(--pri);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.4)}
.mode button[data-v="act"][aria-pressed="true"]{color:var(--run)}
.seg.sys3 button{height:52px;font-size:14.5px}
.oilname{margin:8px 2px 0;font-size:13px;color:var(--fg2)}.oilname b{color:var(--fg)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.stepper button{height:58px;border:0;border-radius:14px;background:linear-gradient(180deg,#3A414B,#2A2F37);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #15181C;font:inherit;font-family:Chakra,Plex,sans-serif;font-size:30px;font-weight:700;color:var(--pri);line-height:1}
.stepper button:active{transform:translateY(3px);box-shadow:none}
.stepper input{height:58px;text-align:center;font-family:Chakra,Plex,sans-serif;font-size:26px;font-weight:700}
.tankunit{display:block;text-align:center;margin-top:4px;font-size:13px;color:var(--fg2);font-weight:600}
.reasons{display:grid;gap:8px}
.c-drop{border-color:rgba(255,90,95,.6)!important;background:linear-gradient(180deg,rgba(255,90,95,.14),rgba(255,90,95,.04)),linear-gradient(180deg,var(--pan-t),var(--pan-b))!important;animation:slidein 320ms var(--ease-move) both}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}}
.c-drop .lbl{color:#FFC2C3}
.drop-list{display:grid;gap:6px;margin:4px 0 12px}.drop-it{padding:9px 12px;border-radius:11px;background:rgba(255,90,95,.12);color:#FFC2C3;font-size:14px}.drop-it b{display:block;font-family:Chakra,Plex,sans-serif;font-size:15px}
#f-droptext{margin-top:10px}
.reasons button{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border:1px solid var(--well-line);border-radius:13px;background:var(--well);font:inherit;font-size:16px;font-weight:600;color:var(--fg);text-align:left;transition:transform 140ms var(--ease-enter),border-color 200ms,box-shadow 200ms}
.reasons button:active{transform:scale(.98);transition-duration:0s}
.reasons button i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #4A525E;display:grid;place-items:center}
.reasons button[aria-pressed="true"]{border-color:var(--run);box-shadow:0 0 12px rgba(67,224,138,.3);color:#C8F7DA}
.reasons button[aria-pressed="true"] i{border-color:var(--run);background:var(--run)}
.reasons button[aria-pressed="true"] i:after{content:'';width:8px;height:8px;border-radius:50%;background:#06210F}
.c-drop .reasons button[aria-pressed="true"]{border-color:var(--bad);box-shadow:0 0 12px rgba(255,90,95,.35);color:#FFD6D7}
.c-drop .reasons button[aria-pressed="true"] i{border-color:var(--bad);background:var(--bad)}
textarea{width:100%;min-height:84px;border:1px solid var(--well-line);border-radius:12px;background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.5);padding:12px 14px;font:inherit;font-size:16px;color:var(--fg);outline:none;resize:vertical;margin-top:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;border:1px solid var(--well-line);border-radius:14px;background:var(--well);font:inherit;font-size:15.5px;font-weight:700;color:var(--fg);text-align:left;line-height:1.15}
.acts button svg{flex:none;color:var(--ac)}.acts button small{display:block;font-size:11px;font-weight:400;color:var(--fg3)}
.acts button[aria-pressed="true"]{border-color:var(--ac);box-shadow:0 0 12px rgba(67,224,138,.25)}
.calc{margin-top:8px;padding:8px 12px;border-radius:11px;background:rgba(255,90,95,.12);color:#FFC2C3;font-size:14px}
.tip{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;padding:12px 14px;border-radius:14px;background:rgba(92,225,255,.08);border:1px solid rgba(92,225,255,.3);color:#BDEFFF;font-size:13.5px;line-height:1.45}
.tip b{display:block;font-size:14.5px}.tip button{flex:none;border:0;background:var(--pri);border-radius:10px;padding:6px 10px;font:inherit;font-weight:700;color:#04131A}
[hidden]{display:none!important}
.ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--well-line)}.ck:first-child{border-top:0}
.ck i{flex:none;width:22px;height:22px;border-radius:50%;margin-top:2px;background:#4A525E}
.ck i.ok{background:var(--run);box-shadow:0 0 8px var(--run)}.ck i.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}.ck i.warn{background:var(--warn)}.ck i.wait{background:#4A525E}
.ck b{display:block;font-size:15px}.ck span{display:block;font-size:13.5px;color:var(--fg2)}
#ck-sum b{display:block;font-size:19px}#ck-sum b.yes{color:var(--run)}#ck-sum b.no{color:var(--bad)}#ck-sum span{font-size:14px;color:var(--fg2)}
.ua{font-size:12px;color:var(--fg2);word-break:break-all}
.rec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rec-chips button{border:1px solid var(--well-line);background:var(--well);border-radius:10px;min-height:40px;padding:6px 12px;font:inherit;font-family:Chakra,Plex,sans-serif;font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--fg2)}
.rec-chips button b{color:var(--pri);font-weight:700}
.rec-chips button[aria-pressed="true"]{border-color:var(--pri);color:#fff;box-shadow:0 0 10px var(--pri-s)}
.rec-chips span{font-size:13px;color:var(--bad)}
#f-rec{font-family:Chakra,Plex,sans-serif}
.ask-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ask-b .btn{height:50px;font-size:15.5px}

/* ---------- 3 hydraulic columns ---------- */
.tanks3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.col{position:relative;border-radius:12px;padding:8px 5px 7px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.12));border:1px solid rgba(255,255,255,.05);transition:box-shadow 250ms var(--ease-enter),border-color 250ms}
.col.act{border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent),0 0 22px color-mix(in srgb,var(--c) 25%,transparent)}
.col.abn{border-color:rgba(255,90,95,.7)}
.col.abn.flash{animation:abnPulse 600ms var(--ease-enter) 3}
@keyframes abnPulse{50%{box-shadow:0 0 0 4px rgba(255,90,95,.25),0 0 26px rgba(255,90,95,.45)}}
.cname{display:flex;align-items:center;gap:5px;font-family:Chakra,Plex,sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;padding-left:2px}
.cname i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.cth{font-size:10.5px;color:var(--fg3);margin:0 0 2px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tank{display:block;width:100%;height:auto}

function sheetSetup(){if(document.getElementById('sheet'))return;document.body.insertAdjacentHTML('beforeend',sheetHTML());
  document.getElementById('scrim').onclick=kClose;
  document.getElementById('sheet').addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('button');if(!t||!KS.id)return;
    if(t.dataset.m){LS.set('kmode',t.dataset.m);var sh=document.getElementById('sheet');sh.dataset.m=t.dataset.m;[].forEach.call(document.querySelectorAll('#kmode button'),function(b){b.setAttribute('aria-pressed',String(b===t))});if(t.dataset.m==='slide')rulerBuild();KS.fresh=true;return}
    if(t.dataset.n){var info=KS.info,cur=val(KS.id)!==''?+val(KS.id):(info.prev!=null?info.prev:info.lo),v=Math.max(0,cur+(+t.dataset.n)*info.step);setField(KS.id,info.kind==='L'&&info.step>=1?String(Math.round(v)):v.toFixed(1));rulerTo(v,true);buzz();return}
    if(t.dataset.ok){var p=KS.info.prev;setField(KS.id,KS.info.kind==='L'?String(Math.round(p)):p.toFixed(1));setTimeout(kNext,160);return}
    if(t.dataset.q){setField(KS.id,t.dataset.q);setTimeout(kNext,160);return}
    if(t.dataset.k==='n'){kNext();return}if(t.dataset.k)kKey(t.dataset.k)});
  document.getElementById('rtrack').addEventListener('scroll',function(){if(!R.cfg||!KS.id||Date.now()<R.lock)return;var i=Math.max(0,Math.min(R.cfg.n,Math.round(document.getElementById('rtrack').scrollLeft/TW)));if(i===R.last)return;R.last=i;buzz();
    var v=R.cfg.lo+i*R.cfg.st;setField(KS.id,KS.info.kind==='L'&&R.cfg.st>=1?String(Math.round(v)):v.toFixed(1))},{passive:true})}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(4)}catch(_){}}
/* number fields → open the sheet instead of the phone keyboard */
document.addEventListener('click',function(e){var f=e.target.closest&&e.target.closest('.fld');if(f){e.preventDefault();kOpen(f.dataset.f);KS.fresh=true;return}
  var t=e.target;if(t&&t.id&&/^f-(before|after|drained)$/.test(t.id)){kOpen(t.id);KS.fresh=true}},true);
document.addEventListener('focusin',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('fv')){t.blur();var f=t.closest('.fld'),id=f?f.dataset.f:t.id;if(KS.id!==id)kOpen(id)}});

function bootFx(){var first=true;try{first=!sessionStorage.getItem('hrmBoot');sessionStorage.setItem('hrmBoot','1')}catch(_){}
  if(!first||reduced()){paintCols();return}document.body.classList.add('boot');SYS.forEach(function(s){setLevel(s[0],null);setTemp(s[0],null)});
  requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.remove('boot');document.body.classList.add('booting');setTimeout(paintCols,350);setTimeout(function(){document.body.classList.remove('booting')},1300)})})}

function start(){var code=qp('c')||LS.get('code')||'';var cb=cachedBoot();if(cb)BOOT=cb;
  if(qp('check')){checkPage();return}
  document.getElementById('app').innerHTML='<div class="card" style="margin-top:22vh;text-align:center;color:var(--fg2)">กำลังโหลด… · Loading</div>';
  call('phoneBoot',[code]).then(function(b){if(!b||!b.ok){connFail(new Error('bad_reply'));return}BOOT=b;LS.set('boot',JSON.stringify(b));
      if(b.codeOk){LS.set('code',code);BOOT.code=code;keepUrl(code);form()}else{if(code){LS.del('code');keepUrl('')}gate(code?'รหัสทีมไม่ถูกต้อง · Wrong code':'')}},
    function(e){if(cb&&code&&cb.recorders&&cb.recorders.length){BOOT=cb;BOOT.code=code;form();showErr('ออฟไลน์ · บันทึกได้ ระบบจะส่งให้เมื่อมีเน็ต')}else connFail(e)})}
start();
